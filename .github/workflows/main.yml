name: Verified Agent Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install deps
        run: npm install

      - name: Install ClawHub (optional)
        continue-on-error: true
        run: npx clawhub@latest install verified-agent-identity || true

      - name: Run script
        run: echo "Workflow running..."
