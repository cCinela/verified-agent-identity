name: Verified Agent Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      # OPTIONAL: Install ClawHub skill (skip kalau error)
      - name: Install ClawHub Skill (optional)
        continue-on-error: true
        run: npx clawhub@latest install verified-agent-identity || true

      - name: Create New Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          node scripts/linkHumanToAgent.js \
          --to "github-action" \
          --challenge '{"name":"My Agent","description":"CI Agent"}'
