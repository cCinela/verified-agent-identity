name: Billions Verified Agent

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node (latest)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # Install clawhub CLI
      - name: Install ClawHub
        run: npm install -g clawhub

      # Install Billions identity skill
      - name: Install Verified Identity Skill
        run: npx clawhub@latest install verified-agent-identity

      # Create identity (wallet + DID)
      - name: Create Identity
        run: node scripts/createNewEthereumIdentity.js

      # Generate verification link (IMPORTANT STEP)
      - name: Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js \
          --challenge '{"name":"My Agent","description":"Verified via GitHub Action"}'
