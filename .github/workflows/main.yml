name: Billions Verify (Fixed)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    # 🔥 INI YANG FIX ERROR NODE 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (NEW)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ClawHub
        run: npm install -g clawhub

      - name: Install Skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Create Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human
        run: |
          node scripts/manualLinkHumanToAgent.js \
          --challenge '{"name":"My Agent","description":"Verified via GitHub"}'
