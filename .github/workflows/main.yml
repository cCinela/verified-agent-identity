name: Billions Verify

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          npm install || true
          cd scripts && npm install || true

      # ❌ HAPUS INSTALL CLAWHUB (INI PENYEBAB ERROR)

      - name: Create Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human
        run: |
          node scripts/manualLinkHumanToAgent.js \
          --challenge '{"name":"My Agent","description":"Verified via GitHub"}'
